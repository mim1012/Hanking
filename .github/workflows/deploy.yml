name: deploy-to-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build c2server (linux amd64)
        working-directory: server
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o c2server .

      - name: Deploy to VPS (ssh/scp CLI)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
          scp $SSHOPTS server/c2server c2push/c2push.py ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/c2_deploy/
          ssh $SSHOPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            systemctl stop c2server
            cp /root/c2_deploy/c2server /root/c2/c2server
            cp /root/c2_deploy/c2push.py /root/c2/c2push.py
            chmod +x /root/c2/c2server
            systemctl start c2server
            systemctl restart c2push
            echo "deploy ok"
          '

      - name: Diagnose c2push (post-deploy)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
          ssh $SSHOPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            sleep 45
            echo "=== c2server/c2push active? ==="
            systemctl is-active c2server; systemctl is-active c2push
            echo "=== winhips C2 reachability ==="
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/198.13.42.105/80" 2>/dev/null && echo "198.13.42.105:80 OK" || echo "198.13.42.105:80 FAIL"
            echo "=== c2push journal (last 100) ==="
            journalctl -u c2push --no-pager -n 100 2>/dev/null | tail -100
          '
