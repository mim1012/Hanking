name: deploy-to-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build c2server (linux amd64)
        working-directory: server
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o c2server .

      - name: Deploy to VPS (ssh/scp CLI)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
          scp $SSHOPTS server/c2server c2push/c2push.py ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/c2_deploy/
          ssh $SSHOPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            systemctl stop c2server
            cp /root/c2_deploy/c2server /root/c2/c2server
            cp /root/c2_deploy/c2push.py /root/c2/c2push.py
            chmod +x /root/c2/c2server
            systemctl start c2server
            sleep 2
            systemctl is-active c2server || { journalctl -u c2server -n 40 --no-pager; exit 1; }
            systemctl restart c2push
            echo "deploy ok"
          '

      - name: Diagnose c2push (post-deploy)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
          ssh $SSHOPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            sleep 60
            echo "=== c2server status ==="
            systemctl is-active c2server || true
            journalctl -u c2server -n 30 --no-pager || true
            echo "=== journalctl grep (BLANC-101|PC-115|ffmpeg|ERR|끊) ==="
            journalctl -u c2push -n 200 --no-pager | grep -E "BLANC-101|PC-115|ffmpeg|ERR|끊"
            echo "=== (context) BLANC-101 / PC-115 최근 40줄 ==="
            journalctl -u c2push -n 400 --no-pager | grep -E "BLANC-101|PC-115" | tail -40
          '
